  <!-- montech-hyperflow. Octagon ring = the pump head seen face on, 2px wall. Inside it the display: a dash when stopped, two digit blocks when running. Single currentColor, every light area is negative space via fill-rule evenodd, so the shell can recolour it for a light or a dark panel. Comment kept inside <svg>: gdk-pixbuf sniffs the format from the first bytes and will not load a file whose root element is pushed past that window. -->
  <path fill="currentColor" fill-rule="evenodd" d="M5 1 H11 L15 5 V11 L11 15 H5 L1 11 V5 Z M5.8284 3 H10.1716 L13 5.8284 V10.1716 L10.1716 13 H5.8284 L3 10.1716 V5.8284 Z M4 7.5 H12 V8.5 H4 Z"/>
</svg>
