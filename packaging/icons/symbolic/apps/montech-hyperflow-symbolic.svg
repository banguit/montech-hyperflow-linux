<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <!-- The HyperFlow pump head is an octagon: square body with deep 45-degree
       corner cuts. Drawn from the product's geometry so the icon reads as
       this cooler and not a generic thermometer. Single currentColor
       silhouette, because the theme recolours symbolic icons.
       Comments stay inside <svg>: gdk-pixbuf sniffs the image format from
       the first bytes and will not recognise a file whose root element is
       pushed past that window. -->
