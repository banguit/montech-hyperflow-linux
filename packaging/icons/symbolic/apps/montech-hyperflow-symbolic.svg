<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <!-- Panel icon, service running: pump head with two lit digits.
       Symbolic icons are recoloured by the theme, so this is a single
       currentColor silhouette and must stay legible at 16px.
       Keep the comment inside <svg>: gdk-pixbuf sniffs the format from the
       first bytes of the file and will not recognise an SVG whose root
       element is pushed past that window by a leading comment. -->
  <path fill="currentColor" fill-rule="evenodd"
        d="M8 0.9A7.1 7.1 0 1 0 8 15.1 7.1 7.1 0 0 0 8 0.9zm0 1.4a5.7 5.7 0 1 1 0 11.4 5.7 5.7 0 0 1 0-11.4z"/>
  <path fill="currentColor" fill-rule="evenodd"
        d="M4.6 5.9h6.8a.6.6 0 0 1 .6.6v3a.6.6 0 0 1-.6.6H4.6a.6.6 0 0 1-.6-.6v-3a.6.6 0 0 1 .6-.6zm1.15 1.3v1.6h1.5v-1.6zm2.9 0v1.6h1.6v-1.6z"/>
</svg>
